# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Apache Struts2 S2-061 Forced OGNL Evaluation (Vulhub, by phith0n and the Vulhub contributors) as an Isoloom spec:
# Vulhub's struts2/s2-061, vendored in app/, run from the published image vulhub/struts2:2.5.25.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: vulhub-struts2-s2-061

networks:
  lab: { cidr: 10.61.14.0/24, internet: false }

machines:
  struts2:
    networks: { lab: 10 }
    services: [{ port: 8080, name: web, http: true, publish: 8080 }]
    resources: { cpus: 1, memory_mb: 512 }
    docker:
      image: vulhub/struts2:2.5.25

checks:
  - name: the application answers
    http: http://struts2:8080/
    wait: 120
  - name: the index echoes the id parameter into the page
    script: checks/app.sh
    wait: 60

message: |
  A Struts2 2.5.25 application answers at http://localhost:{{ machines.struts2.services.0.publish }}/.
  The page puts the id parameter into a tag attribute. How many times is it evaluated?
